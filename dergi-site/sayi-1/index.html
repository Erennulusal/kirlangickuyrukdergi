<!-- Site logosu / sekme ikonu. favicon.svg dosyası deponun KÖK klasöründe

     olduğu için iki klasör yukarı çıkıyoruz. -->

<meta property="og:title" content="Kırlangıçkuyruk Dergi - Sayı 1">
<meta property="og:description" content="Dergimizin 1. sayısını buradan ücretsiz okuyabilirsin.">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  #wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 70px 14px 46px;
  }
  #book {
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .page {
    background: #fff;
    overflow: hidden;
  }
  .page img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #999;
    font-size: 13px;
    opacity: 0.8;
  }
  #topBar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #202020;
    padding: 8px 18px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 100;
  }
  #topBar a.back-link {
    color: #ddd;
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
    padding-right: 16px;
    border-right: 1px solid rgba(255,255,255,0.15);
    transition: color 0.15s ease;
  }
  #topBar a.back-link:hover {
    color: #fff;
  }
  .jump-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .jump-group .jlabel {
    color: #aaa;
    font-size: 13px;
    white-space: nowrap;
  }
  #pageInput {
    width: 48px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.3);
    background: #2e2e2e;
    color: #fff;
    border-radius: 14px;
    padding: 6px 4px;
    font-size: 13px;
    outline: none;
  }
  #pageInput:focus {
    border-color: #c99a3d;
  }
  #pageInput::-webkit-outer-spin-button,
  #pageInput::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #pageGoBtn, #fullscreenBtn {
    border: none;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    background: #c99a3d;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  #pageGoBtn:hover, #fullscreenBtn:hover {
    background: #ddb35c;
  }
  #pageGoBtn {
    background: #4715ab;
    color: #fff;
  }
  #pageGoBtn:hover {
    background: #5c22d6;
  }
  #fullscreenBtn {
    padding-left: 16px;
    border-left: 1px solid rgba(255,255,255,0.15);
    border-radius: 0;
    padding: 6px 0 6px 16px;
    background: none;
    color: #ddd;
  }
  #fullscreenBtn:hover {
    background: none;
    color: #fff;
  }
  #pageIndicator {
    color: #ccc;
    font-size: 12px;
    background: #2e2e2e;
    padding: 5px 12px;
    border-radius: 14px;
    min-width: 46px;
    text-align: center;
    white-space: nowrap;
  }

  /* ---- TELEFON MODU ----
     Dar ekranlarda üst bar ekrana sığsın diye sıkılaştırıyoruz:
     yazılar küçülüyor, aralar daralıyor, "Sayfaya git:" etiketi ve
     tam ekran butonunun yazısı gizleniyor (ikon kalıyor). Masaüstü
     görünümü bundan hiç etkilenmiyor. */
  @media (max-width: 700px) {
    #topBar {
      top: 8px;
      gap: 8px;
      padding: 6px 12px;
      max-width: calc(100vw - 16px);
    }
    #topBar a.back-link {
      font-size: 12px;
      padding-right: 8px;
    }
    .jump-group { gap: 5px; }
    .jump-group .jlabel { display: none; }
    #pageInput {
      width: 42px;
      font-size: 12px;
      padding: 5px 3px;
    }
    #pageGoBtn {
      font-size: 12px;
      padding: 5px 10px;
    }
    #pageIndicator {
      font-size: 11px;
      padding: 4px 9px;
      min-width: 40px;
    }
    #fullscreenBtn {
      font-size: 0;            /* yazıyı gizle, sadece ikon kalsın */
      padding: 5px 0 5px 10px;
    }
    #fullscreenBtn::before {
      content: '⛶';
      font-size: 15px;
    }
    #hint {
      font-size: 11px;
      bottom: 10px;
    }
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="book"></div>
</div>
<div id="hint">Sayfaları çevirmek için sürükle ya da tıkla</div>

<div id="topBar">
  <a href="../../index.html" class="back-link">Tüm sayılar</a>
  <div class="jump-group">
    <span class="jlabel">Sayfaya git:</span>
    <input type="number" id="pageInput" min="1" placeholder="1-66">
    <button id="pageGoBtn">Git</button>
  </div>
  <span id="pageIndicator">- / -</span>
  <button id="fullscreenBtn">⛶ Tam ekran</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
<script>

  const pages = [
    "Kırlangıçkuyruk_Dergi_1.jpg",
    "Kırlangıçkuyruk_Dergi_2.jpg",
    "Kırlangıçkuyruk_Dergi_3.jpg",
    "Kırlangıçkuyruk_Dergi_4.jpg",
    "Kırlangıçkuyruk_Dergi_5_2.jpg",
    "Kırlangıçkuyruk_Dergi_6.jpg",
    "Kırlangıçkuyruk_Dergi_7.jpg",
    "Kırlangıçkuyruk_Dergi_8.jpg",
    "Kırlangıçkuyruk_Dergi_9.jpg",
    "Kırlangıçkuyruk_Dergi_10.jpg",
    "Kırlangıçkuyruk_Dergi_11.jpg",
    "Kırlangıçkuyruk_Dergi_12.jpg",
    "Kırlangıçkuyruk_Dergi_13.jpg",
    "Kırlangıçkuyruk_Dergi_14.jpg",
    "Kırlangıçkuyruk_Dergi_15.jpg",
    "Kırlangıçkuyruk_Dergi_16.jpg",
    "Kırlangıçkuyruk_Dergi_17.jpg",
    "Kırlangıçkuyruk_Dergi_18.jpg",
    "Kırlangıçkuyruk_Dergi_19.jpg",
    "Kırlangıçkuyruk_Dergi_20.jpg",
    "Kırlangıçkuyruk_Dergi_21.jpg",
    "Kırlangıçkuyruk_Dergi_22.jpg",
    "Kırlangıçkuyruk_Dergi_23.jpg",
    "Kırlangıçkuyruk_Dergi_24.jpg",
    "Kırlangıçkuyruk_Dergi_25.jpg",
    "Kırlangıçkuyruk_Dergi_26.jpg",
    "Kırlangıçkuyruk_Dergi_27.jpg",
    "Kırlangıçkuyruk_Dergi_28.jpg",
    "Kırlangıçkuyruk_Dergi_29.jpg",
    "Kırlangıçkuyruk_Dergi_30.jpg",
    "Kırlangıçkuyruk_Dergi_31_2.jpg",
    "Kırlangıçkuyruk_Dergi_32.jpg",
    "Kırlangıçkuyruk_Dergi_33.jpg",
    "Kırlangıçkuyruk_Dergi_34.jpg",
    "Kırlangıçkuyruk_Dergi_35.jpg",
    "Kırlangıçkuyruk_Dergi_36.jpg",
    "Kırlangıçkuyruk_Dergi_37.jpg",
    "Kırlangıçkuyruk_Dergi_38.jpg",
    "Kırlangıçkuyruk_Dergi_39.jpg",
    "Kırlangıçkuyruk_Dergi_40.jpg",
    "Kırlangıçkuyruk_Dergi_41.jpg",
    "Kırlangıçkuyruk_Dergi_42.jpg",
    "Kırlangıçkuyruk_Dergi_43.jpg",
    "Kırlangıçkuyruk_Dergi_44.jpg",
    "Kırlangıçkuyruk_Dergi_45.jpg",
    "Kırlangıçkuyruk_Dergi_46.jpg",
    "Kırlangıçkuyruk_Dergi_47.jpg",
    "Kırlangıçkuyruk_Dergi_48.jpg",
    "Kırlangıçkuyruk_Dergi_49.jpg",
    "Kırlangıçkuyruk_Dergi_50.jpg",
    "Kırlangıçkuyruk_Dergi_51.jpg",
    "Kırlangıçkuyruk_Dergi_52.jpg",
    "Kırlangıçkuyruk_Dergi_53.jpg",
    "Kırlangıçkuyruk_Dergi_54.jpg",
    "Kırlangıçkuyruk_Dergi_55.jpg",
    "Kırlangıçkuyruk_Dergi_56.jpg",
    "Kırlangıçkuyruk_Dergi_57.jpg",
    "Kırlangıçkuyruk_Dergi_58.jpg",
    "Kırlangıçkuyruk_Dergi_59.jpg",
    "Kırlangıçkuyruk_Dergi_60.jpg",
    "Kırlangıçkuyruk_Dergi_61.jpg",
    "Kırlangıçkuyruk_Dergi_62.jpg",
    "Kırlangıçkuyruk_Dergi_63.jpg",
    "Kırlangıçkuyruk_Dergi_64.jpg",
    "Kırlangıçkuyruk_Dergi_65.jpg",
    "Kırlangıçkuyruk_Dergi_66.jpg"
  ];
  // ================================================================

  document.getElementById('pageInput').setAttribute('max', pages.length);
  document.getElementById('pageInput').setAttribute('placeholder', '1-' + pages.length);

  let bookEl = document.getElementById('book'); // "let": her rebuild'de yeni elemanla değiştiriliyor
  const wrapperEl = document.getElementById('wrapper');
  const topBarEl = document.getElementById('topBar');
  const hintEl = document.getElementById('hint');
  let pageFlip = null;

  function updateIndicator(zeroBasedPage) {
    document.getElementById('pageIndicator').textContent =
      (zeroBasedPage + 1) + ' / ' + pages.length;
  }

  // topBar ve hint'in GERÇEK yüksekliğini ölçüp #wrapper'ın boşluğunu
  // ona göre ayarlıyoruz. GUI kitabın üstüne binmiyor, ama gereğinden
  // fazla boşluk da bırakılmıyor - kitap mümkün olduğunca büyük kalıyor.
  function applyReserves() {
    const gap = 10; // GUI ile kitap arasındaki nefes payı
    const topBarRect = topBarEl.getBoundingClientRect();
    const hintRect = hintEl.getBoundingClientRect();
    const topReserve = Math.ceil(topBarRect.bottom + gap);
    const bottomReserve = Math.ceil((window.innerHeight - hintRect.top) + gap);
    const sidePadding = window.innerWidth < 700 ? 8 : 16;

    wrapperEl.style.padding = topReserve + 'px ' + sidePadding + 'px ' + bottomReserve + 'px';

    return {
      availWidth: Math.max(280, window.innerWidth - sidePadding * 2),
      availHeight: Math.max(320, window.innerHeight - topReserve - bottomReserve)
    };
  }

  // TELEFON MODU: dar ekranlarda dergiyi çift sayfa (spread) yerine
  // TEK sayfa olarak gösteriyoruz. Bunu ayrı bir ayarla değil, sayfa
  // genişliğini hesaplarken ikiye bölmeyerek yapıyoruz: sayfa, kabına
  // sığmayacak kadar geniş olunca StPageFlip zaten kendiliğinden
  // "portrait" (tek sayfa) moduna geçiyor (usePortrait: true sayesinde).
  function isSinglePageMode() {
    return window.innerWidth < 700;
  }

  function computePageSize(ratio, naturalWidth) {
    const { availWidth, availHeight } = applyReserves();

    let pageWidth = isSinglePageMode() ? availWidth : availWidth / 2;
    let pageHeight = pageWidth * ratio;

    if (pageHeight > availHeight) {
      pageHeight = availHeight;
      pageWidth = pageHeight / ratio;
    }

    if (naturalWidth) {
      const dpr = window.devicePixelRatio || 1;
      const maxWidthFromSource = naturalWidth / dpr;
      if (pageWidth > maxWidthFromSource) {
        pageWidth = maxWidthFromSource;
        pageHeight = pageWidth * ratio;
      }
    }

    return {
      width: Math.round(Math.max(160, pageWidth)),
      height: Math.round(Math.max(220, pageHeight))
    };
  }

  let coverRatio = null;
  let coverNaturalWidth = null;

  // Pencere boyutu her değiştiğinde (yeniden boyutlandırma, tam ekrana
  // giriş/çıkış, mobilde adres çubuğunun gizlenmesi vs.) kitabı CSS ile
  // küçültüp bulanıklaştırmak yerine, o anki gerçek piksel ölçüleriyle
  // SIFIRDAN kuruyoruz. Bu yüzden sayfalar her zaman keskin kalıyor.
  function rebuildAtCurrentPage() {
    if (!coverRatio) return;
    const current = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
    if (pageFlip) {
      pageFlip.destroy();
      pageFlip = null;
    }
    buildBook(coverRatio, current);
  }

  // Alt ipucu yazısı, telefon modunda artık tıklama değil kaydırma
  // (swipe) ile sayfa çevrildiğini belirtecek şekilde güncelleniyor.
  function updateHintText() {
    hintEl.textContent = isSinglePageMode()
      ? 'Sayfaları çevirmek için parmağınla sağa/sola kaydır'
      : 'Sayfaları çevirmek için sürükle ya da tıkla';
  }

  function buildBook(ratio, startPage) {
    updateHintText();
    const size = computePageSize(ratio, coverNaturalWidth);

    // ÖNEMLİ DÜZELTME: pageFlip.destroy() sadece içeriği temizlemiyor,
    // bağlı olduğu #book elemanının KENDİSİNİ DOM'dan kaldırıyor
    // ("Remove a root HTML element" - StPageFlip dokümantasyonu).
    // Aynı (artık kaldırılmış) elemanı tekrar kullanmaya çalışmak,
    // özellikle tam ekrana geçince kitabın görünmez olmasına sebep
    // oluyordu. Çözüm: her kurulumda sıfırdan yeni bir #book elemanı
    // oluşturup onu kullanmak.
    const oldBookEl = document.getElementById('book');
    if (oldBookEl && oldBookEl.parentNode) {
      oldBookEl.parentNode.removeChild(oldBookEl);
    }
    bookEl = document.createElement('div');
    bookEl.id = 'book';
    wrapperEl.appendChild(bookEl);

    pages.forEach(function (src, idx) {
      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      if (idx === 0 || idx === pages.length - 1) {
        pageDiv.setAttribute('data-density', 'hard');
      }
      const img = document.createElement('img');
      img.src = src;
      img.draggable = false;
      pageDiv.appendChild(img);
      bookEl.appendChild(pageDiv);
    });

    pageFlip = new St.PageFlip(bookEl, {
      width: size.width,
      height: size.height,
      size: "fixed",
      showCover: true,
      mobileScrollSupport: true,
      usePortrait: true,
      // Telefon modunda (tek sayfa) çevirme animasyonu tamamen kapalı:
      // sayfa anında değişiyor, kıvrılma/gölge yok. Masaüstünde
      // (çift sayfa/spread) animasyon aynen eskisi gibi çalışmaya devam
      // ediyor.
      flippingTime: isSinglePageMode() ? 1 : 1000,
      drawShadow: !isSinglePageMode(),
      // Telefon modunda (tek sayfa) kütüphanenin kendi dokunma/tıklama
      // mantığını TAMAMEN kapatıyoruz. Bu mantık, fiziksel bir sayfa
      // köşesini kaldırıp sürükleme simülasyonu yaptığı için ekranın
      // neredeyse bir ucundan diğerine kaydırmayı gerektiriyordu ve yön
      // de kafa karıştırıcıydı. Sayfa geçişini artık aşağıdaki kendi
      // basit kaydırma (swipe) algılayıcımız yönetiyor. Masaüstünde
      // (çift sayfa) eskisi gibi hem tıklama hem sürükleme çalışmaya
      // devam ediyor.
      useMouseEvents: !isSinglePageMode()
    });

    pageFlip.on('init', function (e) {
      let initial = e.data.page;
      if (typeof startPage === 'number' && startPage >= 0 && startPage < pages.length) {
        initial = startPage;
        pageFlip.turnToPage(initial);
      } else {
        const params = new URLSearchParams(window.location.search);
        const requested = parseInt(params.get('sayfa'), 10);
        if (!isNaN(requested) && requested >= 1 && requested <= pages.length) {
          initial = requested - 1;
          pageFlip.turnToPage(initial);
        }
      }
      updateIndicator(initial);
    });

    pageFlip.on('flip', function (e) {
      updateIndicator(e.data);
      const newUrl = window.location.pathname + '?sayfa=' + (e.data + 1);
      window.history.replaceState(null, '', newUrl);
    });

    pageFlip.loadFromHTML(bookEl.querySelectorAll('.page'));
  }

  const testImg = new Image();
  testImg.onload = function () {
    coverRatio = testImg.naturalHeight / testImg.naturalWidth;
    coverNaturalWidth = testImg.naturalWidth;
    buildBook(coverRatio);
  };
  testImg.onerror = function () {
    document.getElementById('hint').textContent =
      "Görsel bulunamadı. 'pages' listesindeki dosya adlarını kontrol et.";
  };
  testImg.src = pages[0];

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuildAtCurrentPage, 200);
  });

  // ---- Telefon modunda basit kaydırma (swipe) ile sayfa çevirme ----
  // Kısa ve doğal bir "sola/sağa kaydır" hareketini kendimiz yakalayıp
  // doğrudan flipNext()/flipPrev() çağırıyoruz: parmağın gittiği yön
  // esas alınıyor (sola kaydır -> sonraki sayfa, sağa kaydır -> önceki
  // sayfa), bu yüzden yön artık kafa karıştırmıyor. Küçük bir mesafe
  // (MIN_SWIPE) yeterli oluyor, ekranın ucundan ucuna kaydırmaya gerek
  // kalmıyor. Sadece telefon modunda (isSinglePageMode) çalışır;
  // masaüstünde StPageFlip'in kendi tıklama/sürükleme mantığı geçerli.
  const MIN_SWIPE = 40; // px
  let touchStartX = null;
  let touchStartY = null;

  wrapperEl.addEventListener('touchstart', function (e) {
    if (!isSinglePageMode() || !pageFlip) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  wrapperEl.addEventListener('touchend', function (e) {
    if (!isSinglePageMode() || !pageFlip || touchStartX === null) return;
    const t = e.changedTouches[0];
    const deltaX = t.clientX - touchStartX;
    const deltaY = t.clientY - touchStartY;
    touchStartX = null;
    touchStartY = null;

    // Yatay hareket, hem eşik değerini hem de dikey hareketi geçmeli
    // (aksi halde dikey bir dokunuş/kaydırma yanlışlıkla sayfa çevirmesin).
    if (Math.abs(deltaX) < MIN_SWIPE || Math.abs(deltaX) < Math.abs(deltaY)) return;

    if (deltaX < 0) {
      pageFlip.flipNext('top');   // sola kaydır -> sonraki sayfa
    } else {
      pageFlip.flipPrev('top');   // sağa kaydır -> önceki sayfa
    }
  }, { passive: true });

  // ---- Sayfaya git kutusu ----
  const pageInput = document.getElementById('pageInput');
  const pageGoBtn = document.getElementById('pageGoBtn');

  function goToTypedPage() {
    if (!pageFlip) return;
    const num = parseInt(pageInput.value, 10);
    if (isNaN(num) || num < 1 || num > pages.length) {
      pageInput.style.background = '#ffb3b3';
      setTimeout(() => { pageInput.style.background = ''; }, 400);
      return;
    }
    pageFlip.turnToPage(num - 1);
  }

  pageGoBtn.addEventListener('click', goToTypedPage);
  pageInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') goToTypedPage();
  });

  document.addEventListener('keydown', function (e) {
    if (document.activeElement === pageInput) return;
    if (!pageFlip) return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      pageFlip.flipNext('top');
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      pageFlip.flipPrev('top');
    }
  });

  const fullscreenBtn = document.getElementById('fullscreenBtn');

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateFullscreenLabel() {
    fullscreenBtn.textContent = isFullscreen() ? '⛶ Tam ekrandan çık' : '⛶ Tam ekran';
  }

  fullscreenBtn.addEventListener('click', function () {
    const el = document.documentElement;
    if (!isFullscreen()) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', function () {
    updateFullscreenLabel();
    rebuildAtCurrentPage();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    updateFullscreenLabel();
    rebuildAtCurrentPage();
  });
</script>

</body>
</html>
