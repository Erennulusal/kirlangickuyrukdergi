<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  #wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
   
    padding: 84px 16px 56px;
  }
  #book {
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transition: transform 0.2s ease;
  }
  .page {
    background: #fff;
    overflow: hidden;
  }
  .page img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #999;
    font-size: 13px;
    opacity: 0.8;
  }
  #topBar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #202020;
    padding: 8px 18px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 100;
  }
  #topBar a.back-link {
    color: #ddd;
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
    padding-right: 16px;
    border-right: 1px solid rgba(255,255,255,0.15);
    transition: color 0.15s ease;
  }
  #topBar a.back-link:hover {
    color: #fff;
  }
  .jump-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .jump-group .jlabel {
    color: #aaa;
    font-size: 13px;
    white-space: nowrap;
  }
  #pageInput {
    width: 48px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.3);
    background: #2e2e2e;
    color: #fff;
    border-radius: 14px;
    padding: 6px 4px;
    font-size: 13px;
    outline: none;
  }
  #pageInput:focus {
    border-color: #c99a3d;
  }
  #pageInput::-webkit-outer-spin-button,
  #pageInput::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #pageGoBtn, #fullscreenBtn {
    border: none;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    background: #c99a3d;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  #pageGoBtn:hover, #fullscreenBtn:hover {
    background: #ddb35c;
  }
  #fullscreenBtn {
    padding-left: 16px;
    border-left: 1px solid rgba(255,255,255,0.15);
    border-radius: 0;
    padding: 6px 0 6px 16px;
    background: none;
    color: #ddd;
  }
  #fullscreenBtn:hover {
    background: none;
    color: #fff;
  }
  #pageIndicator {
    color: #ccc;
    font-size: 12px;
    background: #2e2e2e;
    padding: 5px 12px;
    border-radius: 14px;
    min-width: 46px;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="book"></div>
</div>
<div id="hint">Sayfaları çevirmek için sürükle ya da tıkla</div>

<div id="topBar">
  <a href="../" class="back-link">Tüm sayılar</a>
  <div class="jump-group">
    <span class="jlabel">Sayfaya git:</span>
    <input type="number" id="pageInput" min="1" placeholder="1-66">
    <button id="pageGoBtn">Git</button>
  </div>
  <span id="pageIndicator">- / -</span>
  <button id="fullscreenBtn">⛶ Tam ekran</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    "Kırlangıçkuyruk_Dergi_62.png",
    "Kırlangıçkuyruk_Dergi_63.png",
    "Kırlangıçkuyruk_Dergi_64.png",
    "Kırlangıçkuyruk_Dergi_65.png",
    "Kırlangıçkuyruk_Dergi_66.png"
  ];
  // ================================================================

  document.getElementById('pageInput').setAttribute('max', pages.length);
  document.getElementById('pageInput').setAttribute('placeholder', '1-' + pages.length);

  const bookEl = document.getElementById('book');
  let pageFlip = null;

  function updateIndicator(zeroBasedPage) {
    document.getElementById('pageIndicator').textContent =
      (zeroBasedPage + 1) + ' / ' + pages.length;
  }


  function computePageSize(ratio, naturalWidth) {
    const topReserve = 96;    
    const bottomReserve = 64; 
    const sidePadding = 24;

    const availWidth = Math.max(280, window.innerWidth - sidePadding * 2);
    const availHeight = Math.max(320, window.innerHeight - topReserve - bottomReserve);

  
    let pageWidth = availWidth / 2;
    let pageHeight = pageWidth * ratio;

    if (pageHeight > availHeight) {
      pageHeight = availHeight;
      pageWidth = pageHeight / ratio;
    }


    if (naturalWidth) {
      const dpr = window.devicePixelRatio || 1;
      const maxWidthFromSource = naturalWidth / dpr;
      if (pageWidth > maxWidthFromSource) {
        pageWidth = maxWidthFromSource;
        pageHeight = pageWidth * ratio;
      }
    }

    return {
      width: Math.round(Math.max(160, pageWidth)),
      height: Math.round(Math.max(220, pageHeight))
    };
  }

  let coverRatio = null;
  let coverNaturalWidth = null;
  let baseSize = null; 

  function updateBookScale() {

    if (!baseSize || !coverRatio) return;
    const target = computePageSize(coverRatio, coverNaturalWidth);
    let scale = Math.min(target.width / baseSize.width, target.height / baseSize.height);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    scale = Math.min(scale, 1);
    bookEl.style.transform = 'scale(' + scale + ')';
  }

  function buildBook(ratio, startPage) {
    const size = computePageSize(ratio, coverNaturalWidth);
    baseSize = size;
    bookEl.innerHTML = '';
    bookEl.style.transform = 'scale(1)';


    pages.forEach(function (src, idx) {
      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      if (idx === 0 || idx === pages.length - 1) {
        pageDiv.setAttribute('data-density', 'hard');
      }
      const img = document.createElement('img');
      img.src = src;
      img.draggable = false;
      pageDiv.appendChild(img);
      bookEl.appendChild(pageDiv);
    });

    pageFlip = new St.PageFlip(bookEl, {
      width: size.width,
      height: size.height,
      size: "fixed",
      showCover: true,
      mobileScrollSupport: true,
      usePortrait: true
    });


    pageFlip.on('init', function (e) {
      let initial = e.data.page;
      if (typeof startPage === 'number' && startPage >= 0 && startPage < pages.length) {
        initial = startPage;
        pageFlip.turnToPage(initial);
      } else {
        const params = new URLSearchParams(window.location.search);
        const requested = parseInt(params.get('sayfa'), 10);
        if (!isNaN(requested) && requested >= 1 && requested <= pages.length) {
          initial = requested - 1;
          pageFlip.turnToPage(initial);
        }
      }
      updateIndicator(initial);
    });

    pageFlip.on('flip', function (e) {
      updateIndicator(e.data);
      const newUrl = window.location.pathname + '?sayfa=' + (e.data + 1);
      window.history.replaceState(null, '', newUrl);
    });

    pageFlip.loadFromHTML(bookEl.querySelectorAll('.page'));
  }


  const testImg = new Image();
  testImg.onload = function () {
    coverRatio = testImg.naturalHeight / testImg.naturalWidth;
    coverNaturalWidth = testImg.naturalWidth;
    buildBook(coverRatio);
  };
  testImg.onerror = function () {
    document.getElementById('hint').textContent =
      "Görsel bulunamadı. 'pages' listesindeki dosya adlarını kontrol et.";
  };
  testImg.src = pages[0];


  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateBookScale, 150);
  });

  // ---- Sayfaya git kutusu ----
  const pageInput = document.getElementById('pageInput');
  const pageGoBtn = document.getElementById('pageGoBtn');

  function goToTypedPage() {
    if (!pageFlip) return;
    const num = parseInt(pageInput.value, 10);
    if (isNaN(num) || num < 1 || num > pages.length) {
      pageInput.style.background = '#ffb3b3';
      setTimeout(() => { pageInput.style.background = ''; }, 400);
      return;
    }
    pageFlip.turnToPage(num - 1);
  }

  pageGoBtn.addEventListener('click', goToTypedPage);
  pageInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') goToTypedPage();
  });


  document.addEventListener('keydown', function (e) {

    if (document.activeElement === pageInput) return;
    if (!pageFlip) return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      pageFlip.flipNext('top');
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      pageFlip.flipPrev('top');
    }
  });


  const fullscreenBtn = document.getElementById('fullscreenBtn');

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateFullscreenLabel() {
    fullscreenBtn.textContent = isFullscreen() ? '⛶ Tam ekrandan çık' : '⛶ Tam ekran';
  }

  fullscreenBtn.addEventListener('click', function () {
    const el = document.documentElement;
    if (!isFullscreen()) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', function () {
    updateFullscreenLabel();
    updateBookScale();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    updateFullscreenLabel();
    updateBookScale();
  });
</script>
